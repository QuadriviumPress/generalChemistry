version: 1
project:
  title: 'General Chemistry: Principles, Patterns, and Applications'
  short_title: General Chemistry
  description: A complete general chemistry textbook covering matter, reactions, chemical
    structure, thermodynamics, equilibrium, electrochemistry, and organic chemistry.
  authors:
  - name: Saylor Academy
    note: Publisher of the source adaptation (2012); original creator attribution
      omitted at the licensor’s request.
  license: CC-BY-NC-SA-3.0
  open_access: true
  github: QuadriviumPress/generalChemistry
  keywords:
  - chemistry
  - general chemistry
  - thermochemistry
  - open textbook
  error_rules:
  - rule: link-resolves
    severity: ignore
    keys:
    - '{http,https}://**'
  - rule: doi-link-valid
    severity: ignore
