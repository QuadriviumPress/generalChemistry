<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" width="720" height="510" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Copper complex ion formation</title>
<desc id="d">A pale blue copper(II) sulfate solution turns deep blue-violet when aqueous ammonia is added. Below, the hexaaquacopper(II) ion has six water ligands, and in the ammine complex four ammonia molecules replace the four equatorial water ligands while two axial water ligands remain.</desc>
<rect width="720" height="510" fill="#ffffff"/>
<defs><clipPath id="clip1"><path d="M40,40 V200 Q40,210 50,210 H200 Q210,210 210,200 V40 Z"/></clipPath></defs><path d="M40,40 V200 Q40,210 50,210 H200 Q210,210 210,200 V40 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="82.5" width="2000" height="147.5" fill="#9fd0f0" fill-opacity="1"/></g><path d="M33,37 Q40,40 40,48 V200 Q40,210 50,210 H200 Q210,210 210,200 V48 Q210,40 217,37" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="125" y="236" font-size="14" text-anchor="middle" font-weight="bold">CuSO<tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-4.5">(aq): pale blue</tspan></text><defs><clipPath id="clip2"><path d="M500,40 V200 Q500,210 510,210 H660 Q670,210 670,200 V40 Z"/></clipPath></defs><path d="M500,40 V200 Q500,210 510,210 H660 Q670,210 670,200 V40 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="82.5" width="2000" height="147.5" fill="#2f3fa8" fill-opacity="1"/></g><path d="M493,37 Q500,40 500,48 V200 Q500,210 510,210 H660 Q670,210 670,200 V48 Q670,40 677,37" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="585" y="236" font-size="14" text-anchor="middle" font-weight="bold">After NH<tspan dy="4.5" font-size="70%">3</tspan><tspan dy="-4.5">(aq): deep blue-violet</tspan></text><line x1="250" y1="125" x2="452.8" y2="125" stroke="#1f2933" stroke-width="2.5"/><polygon points="460,125 449.1,130.1 449.1,119.9" fill="#1f2933"/><text x="355" y="112" font-size="15" text-anchor="middle" font-weight="bold">+ NH<tspan dy="4.8" font-size="70%">3</tspan><tspan dy="-4.8">(aq)</tspan></text><text x="355" y="150" font-size="13" text-anchor="middle" fill="#52606d">NH<tspan dy="4.2" font-size="70%">3</tspan><tspan dy="-4.2"> replaces four</tspan></text><text x="355" y="166.9" font-size="13" text-anchor="middle" fill="#52606d">equatorial H<tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2">O ligands</tspan></text><line x1="125" y1="350" x2="125" y2="280" stroke="#1f2933" stroke-width="2"/><line x1="125" y1="350" x2="125" y2="420" stroke="#1f2933" stroke-width="2"/><line x1="125" y1="350" x2="75" y2="332" stroke="#1f2933" stroke-width="2"/><line x1="125" y1="350" x2="175" y2="332" stroke="#1f2933" stroke-width="2"/><line x1="125" y1="350" x2="185" y2="372" stroke="#1f2933" stroke-width="2"/><line x1="125" y1="350" x2="65" y2="372" stroke="#1f2933" stroke-width="2"/><circle cx="125" cy="280" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="125" y="284" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="125" cy="420" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="125" y="424" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="75" cy="332" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="75" y="336" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="175" cy="332" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="175" y="336" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="185" cy="372" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="185" y="376" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="65" cy="372" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="65" y="376" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="125" cy="350" r="16" fill="#2f6db5" stroke="#1d4f80" stroke-width="1"/><text x="125" y="354" font-size="10" text-anchor="middle" font-weight="bold" fill="#ffffff">Cu<tspan dy="-4.2" font-size="70%">2+</tspan></text><text x="125" y="450" font-size="15" text-anchor="middle" font-weight="bold">[Cu(H<tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">O)</tspan><tspan dy="4.8" font-size="70%">6</tspan><tspan dy="-4.8">]</tspan><tspan dy="-6.3" font-size="70%">2+</tspan></text><line x1="585" y1="350" x2="585" y2="280" stroke="#1f2933" stroke-width="2"/><line x1="585" y1="350" x2="585" y2="420" stroke="#1f2933" stroke-width="2"/><line x1="585" y1="350" x2="535" y2="332" stroke="#1f2933" stroke-width="2"/><line x1="585" y1="350" x2="635" y2="332" stroke="#1f2933" stroke-width="2"/><line x1="585" y1="350" x2="645" y2="372" stroke="#1f2933" stroke-width="2"/><line x1="585" y1="350" x2="525" y2="372" stroke="#1f2933" stroke-width="2"/><circle cx="585" cy="280" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="585" y="284" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="585" cy="420" r="17" fill="#ffffff" stroke="#d64545" stroke-width="2"/><text x="585" y="424" font-size="10" text-anchor="middle" font-weight="bold" fill="#d64545">H<tspan dy="3.2" font-size="70%">2</tspan><tspan dy="-3.2">O</tspan></text><circle cx="535" cy="332" r="17" fill="#ffffff" stroke="#3d7fc4" stroke-width="2"/><text x="535" y="336" font-size="10" text-anchor="middle" font-weight="bold" fill="#3d7fc4">NH<tspan dy="3.2" font-size="70%">3</tspan></text><circle cx="635" cy="332" r="17" fill="#ffffff" stroke="#3d7fc4" stroke-width="2"/><text x="635" y="336" font-size="10" text-anchor="middle" font-weight="bold" fill="#3d7fc4">NH<tspan dy="3.2" font-size="70%">3</tspan></text><circle cx="645" cy="372" r="17" fill="#ffffff" stroke="#3d7fc4" stroke-width="2"/><text x="645" y="376" font-size="10" text-anchor="middle" font-weight="bold" fill="#3d7fc4">NH<tspan dy="3.2" font-size="70%">3</tspan></text><circle cx="525" cy="372" r="17" fill="#ffffff" stroke="#3d7fc4" stroke-width="2"/><text x="525" y="376" font-size="10" text-anchor="middle" font-weight="bold" fill="#3d7fc4">NH<tspan dy="3.2" font-size="70%">3</tspan></text><circle cx="585" cy="350" r="16" fill="#2f6db5" stroke="#1d4f80" stroke-width="1"/><text x="585" y="354" font-size="10" text-anchor="middle" font-weight="bold" fill="#ffffff">Cu<tspan dy="-4.2" font-size="70%">2+</tspan></text><text x="585" y="450" font-size="15" text-anchor="middle" font-weight="bold">[Cu(NH<tspan dy="4.8" font-size="70%">3</tspan><tspan dy="-4.8">)</tspan><tspan dy="4.8" font-size="70%">4</tspan><tspan dy="-4.8">(H</tspan><tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">O)</tspan><tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">]</tspan><tspan dy="-6.3" font-size="70%">2+</tspan></text><text x="585" y="470" font-size="13" text-anchor="middle" fill="#52606d">often written [Cu(NH<tspan dy="4.2" font-size="70%">3</tspan><tspan dy="-4.2">)</tspan><tspan dy="4.2" font-size="70%">4</tspan><tspan dy="-4.2">]</tspan><tspan dy="-5.5" font-size="70%">2+</tspan></text><text x="355" y="498" font-size="12" text-anchor="middle" fill="#52606d">Schematic colors; the two axial positions keep H<tspan dy="3.8" font-size="70%">2</tspan><tspan dy="-3.8">O ligands.</tspan></text>
