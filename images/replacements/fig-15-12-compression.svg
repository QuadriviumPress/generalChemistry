<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Compressing an N2O4 and NO2 mixture</title>
<desc id="d">Three syringes. (a) 15 milliliters of a red-brown equilibrium mixture. (b) Immediately after compression to 7.5 milliliters the gas is darker. (c) After the system re-establishes equilibrium, it is lighter than in (b) but still darker than in (a).</desc>
<rect width="900" height="434" fill="#ffffff"/>
