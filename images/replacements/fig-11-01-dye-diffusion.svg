<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 386" width="820" height="386" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Dye diffusing in water</title>
<desc id="d">Three beakers in sequence. First, a concentrated drop of blue dye has just entered still water. Next, the dye has spread into a larger, fainter cloud. Finally, the whole beaker is evenly pale blue.</desc>
<rect width="820" height="386" fill="#ffffff"/>
