<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Measuring relative diffusion rates</title>
<desc id="d">A tube has cotton soaked in aqueous ammonia at 3.3 centimeters and cotton soaked in hydrochloric acid at 28.0 centimeters on a ruler. White ammonium chloride first appears with its left edge at 18.8 centimeters, 15.5 centimeters from the ammonia and 9.2 centimeters from the acid. The observed ratio is 1.7, compared with 1.47 predicted by Graham’s law.</desc>
