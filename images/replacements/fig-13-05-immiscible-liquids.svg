<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 382" width="840" height="382" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Water with hexane and with carbon tetrachloride</title>
<desc id="d">Two test tubes. In the first, a violet layer of hexane containing iodine floats on colorless water. In the second, colorless water floats on a violet layer of carbon tetrachloride containing iodine. Densities are labeled: hexane 0.66, water 1.00, and carbon tetrachloride 1.59 grams per milliliter.</desc>
<rect width="840" height="382" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold">(a)</text><text x="420" y="30" font-size="16" font-weight="bold">(b)</text><defs><clipPath id="clip1"><path d="M85,50 V265 A35,35 0 0 0 155,265 V50 Z"/></clipPath></defs><path d="M85,50 V265 A35,35 0 0 0 155,265 V50 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="70" y="80" width="100" height="105.6" fill="#9b4fb0" stroke="none" stroke-width="0" fill-opacity="0.75"/><rect x="70" y="185.6" width="100" height="154.4" fill="#e7f1f8" stroke="none" stroke-width="0" fill-opacity="1"/></g><path d="M82,50 H85 V265 A35,35 0 0 0 155,265 V50 H158" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><line x1="161" y1="132.8" x2="177" y2="132.8" stroke="#52606d" stroke-width="1"/><text x="181" y="130.8" font-size="13">Hexane + I<tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2"> (violet)</tspan></text><text x="181" y="147.7" font-size="13">0.66 g/mL</text><line x1="161" y1="242.8" x2="177" y2="242.8" stroke="#52606d" stroke-width="1"/><text x="181" y="240.8" font-size="13">Water</text><text x="181" y="257.7" font-size="13">1.00 g/mL</text><text x="160" y="334" font-size="15" text-anchor="middle" font-weight="bold">Hexane floats on water</text><defs><clipPath id="clip2"><path d="M485,50 V265 A35,35 0 0 0 555,265 V50 Z"/></clipPath></defs><path d="M485,50 V265 A35,35 0 0 0 555,265 V50 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="470" y="80" width="100" height="105.6" fill="#e7f1f8" stroke="none" stroke-width="0" fill-opacity="1"/><rect x="470" y="185.6" width="100" height="154.4" fill="#9b4fb0" stroke="none" stroke-width="0" fill-opacity="0.75"/></g><path d="M482,50 H485 V265 A35,35 0 0 0 555,265 V50 H558" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><line x1="561" y1="132.8" x2="577" y2="132.8" stroke="#52606d" stroke-width="1"/><text x="581" y="130.8" font-size="13">Water</text><text x="581" y="147.7" font-size="13">1.00 g/mL</text><line x1="561" y1="242.8" x2="577" y2="242.8" stroke="#52606d" stroke-width="1"/><text x="581" y="240.8" font-size="13">CCl<tspan dy="4.2" font-size="70%">4</tspan><tspan dy="-4.2"> + I</tspan><tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2"> (violet)</tspan></text><text x="581" y="257.7" font-size="13">1.59 g/mL</text><text x="560" y="334" font-size="15" text-anchor="middle" font-weight="bold">CCl<tspan dy="4.8" font-size="70%">4</tspan><tspan dy="-4.8"> sinks below water</tspan></text><text x="420" y="368" font-size="13" text-anchor="middle" fill="#52606d">Hexane and CCl<tspan dy="4.2" font-size="70%">4</tspan><tspan dy="-4.2"> are miscible with each other, so each is shown with water in a separate tube.</tspan></text>
</svg>
