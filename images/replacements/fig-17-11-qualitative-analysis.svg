<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 706" width="960" height="706" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Separating group 1 cations</title>
<desc id="d">Flowchart. Adding 6 M HCl to a solution containing silver, lead, and mercury(I) ions gives a white precipitate of AgCl, PbCl2, and Hg2Cl2 (a). Hot water dissolves PbCl2, and sodium chromate then gives yellow PbCrO4 (b). Aqueous ammonia added to a second portion of the precipitate leaves a black solid of mercury and Hg(NH2)Cl and dissolves silver as the diammine complex (c). Adding HCl to the decanted solution reprecipitates white AgCl (d).</desc>
<rect width="960" height="706" fill="#ffffff"/>
<rect x="300" y="10" width="300" height="52" rx="8" fill="#f7fafc" stroke="#9aa5b1" stroke-width="1.3"/><text x="450" y="32.1" font-size="13" text-anchor="middle">Solution containing Ag<tspan dy="-5.5" font-size="70%">+</tspan><tspan dy="5.5">, Pb</tspan><tspan dy="-5.5" font-size="70%">2+</tspan><tspan dy="5.5">, and Hg</tspan><tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-9.6" font-size="70%">2+</tspan></text><text x="450" y="49" font-size="13" text-anchor="middle">(with other cations)</text><line x1="450" y1="62" x2="450" y2="92.6" stroke="#1f2933" stroke-width="2"/><polygon points="450,98 446.2,89.8 453.8,89.8" fill="#1f2933"/><text x="460" y="86" font-size="13" font-weight="bold">+ 6 M HCl</text><text x="300" y="120" font-size="16" font-weight="bold">(a)</text><defs><clipPath id="clip1"><path d="M363,100 V223 A17,17 0 0 0 397,223 V100 Z"/></clipPath></defs><path d="M363,100 V223 A17,17 0 0 0 397,223 V100 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="156" width="2000" height="104" fill="#eef6fb" fill-opacity="1"/><path d="M360,230 Q380,204 400,230 V250 H360 Z" fill="#f4f5f7" stroke="#52606d" stroke-width="1"/></g><path d="M360,100 H363 V223 A17,17 0 0 0 397,223 V100 H400" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="420" y="118" width="240" height="68" rx="8" fill="#f7fafc" stroke="#9aa5b1" stroke-width="1.3"/><text x="540" y="148.1" font-size="13" text-anchor="middle">White precipitate:</text><text x="540" y="165" font-size="13" text-anchor="middle">AgCl, PbCl<tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2">, Hg</tspan><tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2">Cl</tspan><tspan dy="4.2" font-size="70%">2</tspan></text><path d="M380,250 V280 H160 V300" fill="none" stroke="#1f2933" stroke-width="2"/><polygon points="160,304 156.2,295.8 163.8,295.8" fill="#1f2933"/><text x="262" y="250" font-size="13" text-anchor="middle">hot water dissolves PbCl<tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2">;</tspan></text><text x="262" y="266.9" font-size="13" text-anchor="middle">then + Na<tspan dy="4.2" font-size="70%">2</tspan><tspan dy="-4.2">CrO</tspan><tspan dy="4.2" font-size="70%">4</tspan></text><text x="60" y="330" font-size="16" font-weight="bold">(b)</text><defs><clipPath id="clip2"><path d="M143,310 V433 A17,17 0 0 0 177,433 V310 Z"/></clipPath></defs><path d="M143,310 V433 A17,17 0 0 0 177,433 V310 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="366" width="2000" height="104" fill="#fff7d6" fill-opacity="1"/><path d="M140,440 Q160,414 180,440 V460 H140 Z" fill="#f2c200" stroke="#52606d" stroke-width="1"/></g><path d="M140,310 H143 V433 A17,17 0 0 0 177,433 V310 H180" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="200" y="330" width="180" height="56" rx="8" fill="#f7fafc" stroke="#9aa5b1" stroke-width="1.3"/><text x="290" y="354.1" font-size="13" text-anchor="middle">Yellow PbCrO<tspan dy="4.2" font-size="70%">4</tspan><tspan dy="-4.2">(s)</tspan></text><text x="290" y="371" font-size="13" text-anchor="middle">confirms Pb<tspan dy="-5.5" font-size="70%">2+</tspan></text><path d="M380,250 V280 H600 V300" fill="none" stroke="#1f2933" stroke-width="2"/><polygon points="600,304 596.2,295.8 603.8,295.8" fill="#1f2933"/><text x="492" y="250" font-size="13" text-anchor="middle">second portion of precipitate</text><text x="492" y="266.9" font-size="13" text-anchor="middle">+ NH<tspan dy="4.2" font-size="70%">3</tspan><tspan dy="-4.2">(aq)</tspan></text><text x="500" y="330" font-size="16" font-weight="bold">(c)</text><defs><clipPath id="clip3"><path d="M583,310 V433 A17,17 0 0 0 617,433 V310 Z"/></clipPath></defs><path d="M583,310 V433 A17,17 0 0 0 617,433 V310 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip3)"><rect x="-10" y="366" width="2000" height="104" fill="#eef6fb" fill-opacity="1"/><path d="M580,440 Q600,414 620,440 V460 H580 Z" fill="#2d2d2d" stroke="#52606d" stroke-width="1"/></g><path d="M580,310 H583 V433 A17,17 0 0 0 617,433 V310 H620" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="640" y="316" width="250" height="84" rx="8" fill="#f7fafc" stroke="#9aa5b1" stroke-width="1.3"/><text x="765" y="354.4" font-size="12" text-anchor="middle">Black solid: Hg(l) + Hg(NH<tspan dy="3.8" font-size="70%">2</tspan><tspan dy="-3.8">)Cl(s)</tspan></text><text x="765" y="370" font-size="12" text-anchor="middle">Solution: [Ag(NH<tspan dy="3.8" font-size="70%">3</tspan><tspan dy="-3.8">)</tspan><tspan dy="3.8" font-size="70%">2</tspan><tspan dy="-3.8">]</tspan><tspan dy="-5" font-size="70%">+</tspan><tspan dy="5">(aq)</tspan></text><path d="M600,460 V490 H760 V505" fill="none" stroke="#1f2933" stroke-width="2"/><polygon points="760,509 756.2,500.8 763.8,500.8" fill="#1f2933"/><text x="620" y="484" font-size="13">decant solution; + HCl</text><text x="660" y="540" font-size="16" font-weight="bold">(d)</text><defs><clipPath id="clip4"><path d="M743,512 V635 A17,17 0 0 0 777,635 V512 Z"/></clipPath></defs><path d="M743,512 V635 A17,17 0 0 0 777,635 V512 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip4)"><rect x="-10" y="568" width="2000" height="104" fill="#eef6fb" fill-opacity="1"/><path d="M740,642 Q760,616 780,642 V662 H740 Z" fill="#f4f5f7" stroke="#52606d" stroke-width="1"/></g><path d="M740,512 H743 V635 A17,17 0 0 0 777,635 V512 H780" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="800" y="530" width="140" height="56" rx="8" fill="#f7fafc" stroke="#9aa5b1" stroke-width="1.3"/><text x="870" y="554.1" font-size="13" text-anchor="middle">White AgCl(s)</text><text x="870" y="571" font-size="13" text-anchor="middle">confirms Ag<tspan dy="-5.5" font-size="70%">+</tspan></text><text x="330" y="690" font-size="13" text-anchor="middle" fill="#52606d">Schematic flowchart; precipitate colors are representative.</text>
</svg>
