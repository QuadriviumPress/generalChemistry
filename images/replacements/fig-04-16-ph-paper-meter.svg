<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">pH paper and a pH meter</title>
<desc id="d">Left: a pH test strip compared with a reference chart of five schematic colors numbered 1 to 5; the strip matches the color near pH 2. Right: a pH meter whose probe is in a sample beaker displays a reading of 1.70.</desc>
<rect width="740" height="400" fill="#ffffff"/>
<text x="30" y="30" font-size="16" font-weight="bold">pH paper</text><text x="470" y="30" font-size="16" font-weight="bold">pH meter</text><rect x="40" y="70" width="56" height="40" rx="4" fill="#d7301f" stroke="#52606d" stroke-width="1"/><text x="68" y="130" font-size="15" text-anchor="middle" font-weight="bold">1</text><rect x="106" y="70" width="56" height="40" rx="4" fill="#f26b2a" stroke="#52606d" stroke-width="1"/><text x="134" y="130" font-size="15" text-anchor="middle" font-weight="bold">2</text><rect x="172" y="70" width="56" height="40" rx="4" fill="#f7a43b" stroke="#52606d" stroke-width="1"/><text x="200" y="130" font-size="15" text-anchor="middle" font-weight="bold">3</text><rect x="238" y="70" width="56" height="40" rx="4" fill="#f2d649" stroke="#52606d" stroke-width="1"/><text x="266" y="130" font-size="15" text-anchor="middle" font-weight="bold">4</text><rect x="304" y="70" width="56" height="40" rx="4" fill="#c9d94e" stroke="#52606d" stroke-width="1"/><text x="332" y="130" font-size="15" text-anchor="middle" font-weight="bold">5</text><text x="200" y="156" font-size="13" text-anchor="middle" fill="#52606d">Reference chart (schematic colors)</text><rect x="150" y="190" width="22" height="150" rx="2" fill="#f4efe4" stroke="#8a8170" stroke-width="1.2"/><rect x="150" y="196" width="22" height="36" rx="1" fill="#e5522a" stroke="#8a8170" stroke-width="1"/><line x1="176" y1="210" x2="137.9" y2="120.4" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="136,116 141.9,121.3 135.7,124" fill="#52606d"/><text x="196" y="270" font-size="15">Test strip matches</text><text x="196" y="289.5" font-size="15">the chart near pH 2</text><text x="200" y="356" font-size="14" text-anchor="middle" font-weight="bold">Approximate value by color comparison</text><rect x="480" y="70" width="220" height="130" rx="12" fill="#e4e7eb" stroke="#1f2933" stroke-width="2"/><rect x="500" y="88" width="180" height="66" rx="4" fill="#cfe8c6" stroke="#3e4c59" stroke-width="1.5"/><text x="590" y="140" font-size="44" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">1.70</text><text x="590" y="182" font-size="15" text-anchor="middle" font-weight="bold">pH</text><path d="M590,200 C590,240 640,240 640,270 V300" fill="none" stroke="#1f2933" stroke-width="2.5"/><defs><clipPath id="clip1"><path d="M590,300 V370 Q590,380 600,380 H680 Q690,380 690,370 V300 Z"/></clipPath></defs><path d="M590,300 V370 Q590,380 600,380 H680 Q690,380 690,370 V300 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="332" width="2000" height="68" fill="#f6d0c8" fill-opacity="1"/></g><path d="M583,297 Q590,300 590,308 V370 Q590,380 600,380 H680 Q690,380 690,370 V308 Q690,300 697,297" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="628" y="296" width="24" height="74" rx="10" fill="#dfe7ee" stroke="#4f6475" stroke-width="1.8"/><text x="560" y="356" font-size="14" text-anchor="end" font-weight="bold">Numerical reading</text><text x="560" y="376" font-size="14" text-anchor="end">to 0.01 pH unit</text>
</svg>
