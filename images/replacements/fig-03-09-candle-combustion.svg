<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Candle burning in a flask</title>
<desc id="d">A lit candle stands inside a large flask. Arrows show hot carbon dioxide and water vapor rising, and water droplets have condensed on the cooler upper glass.</desc>
<rect width="680" height="470" fill="#ffffff"/>
