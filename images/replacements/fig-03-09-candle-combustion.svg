9.5" font-size="15">on the cooler glass</text><path d="M266,232 Q290,200 272.1,164.3" fill="none" stroke="#5b6b7a" stroke-width="1.8"/><polygon points="270,160 276.3,165 270.2,168" fill="#5b6b7a"/><path d="M254,232 Q230,200 247.9,164.3" fill="none" stroke="#5b6b7a" stroke-width="1.8"/><polygon points="250,160 249.8,168 243.7,165" fill="#5b6b7a"/><text x="476" y="236" font-size="15">Hot products rise:</text><text x="476" y="255.5" font-size="15">CO<tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">(g) and H</tspan><tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">O(g)</tspan></text><line x1="290" y1="210" x2="470" y2="230" stroke="#52606d" stroke-width="1"/><text x="476" y="340" font-size="15">Candle wax</text><text x="476" y="359.5" font-size="15">(a hydrocarbon)</text><line x1="280" y1="340" x2="470" y2="336" stroke="#52606d" stroke-width="1"/><text x="330" y="446" font-size="17" text-anchor="middle" font-weight="bold">hydrocarbon + O<tspan dy="5.4" font-size="70%">2</tspan><tspan dy="-5.4">(g) → CO</tspan><tspan dy="5.4" font-size="70%">2</tspan><tspan dy="-5.4">(g) + H</tspan><tspan dy="5.4" font-size="70%">2</tspan><tspan dy="-5.4">O(g)</tspan></text>
