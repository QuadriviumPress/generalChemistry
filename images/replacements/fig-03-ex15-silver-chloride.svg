<title id="t">Silver chloride precipitation</title>
<desc id="d">A beaker of silver and nitrate ions and a beaker of sodium and chloride ions are mixed. In the product beaker, four silver ions and four chloride ions form white solid AgCl at the bottom, while four sodium ions and four nitrate ions remain dissolved.</desc>
