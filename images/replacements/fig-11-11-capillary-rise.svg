<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Capillary rise of water</title>
<desc id="d">Three vertical glass capillaries of decreasing width stand in water; the water rises highest in the narrowest tube. A tilted tube with the same width as the middle tube has its water surface at the same vertical height above the reservoir, marked h.</desc>
<rect width="820" height="420" fill="#ffffff"/>
