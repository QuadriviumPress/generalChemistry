96.6,292.7 703.4,292.7" fill="#c0392b"/><text x="712" y="270.7" font-size="16" fill="#c0392b" font-style="italic">h</text><line x1="660" y1="231.4" x2="700" y2="231.4" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="530" y="100" font-size="14" text-anchor="middle" font-weight="bold">Tilted tube, same radius</text><text x="530" y="118.2" font-size="14" text-anchor="middle" font-weight="bold">as the middle tube:</text><text x="530" y="136.4" font-size="14" text-anchor="middle" font-weight="bold">same vertical height h</text><text x="420" y="408" font-size="13" text-anchor="middle" fill="#52606d">Glass capillaries in water (rise exaggerated for clarity)</text><text x="60" y="292" font-size="13" fill="#1d4f80">water</text>
