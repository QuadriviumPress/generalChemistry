th="url(#clip3)"><rect x="370" y="50" width="40" height="230" fill="#a0461e" stroke="none" stroke-width="0" fill-opacity="0.5"/></g><path d="M367,60 H370 V250 A20,20 0 0 0 410,250 V60 H413" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="366" y="46" width="48" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><text x="390" y="30" font-size="15" text-anchor="middle" font-weight="bold">Room temperature</text><text x="390" y="330" font-size="14" text-anchor="middle">Reference mixture</text><defs><clipPath id="clip4"><path d="M570,130 V290 Q570,300 580,300 H720 Q730,300 730,290 V130 Z"/></clipPath></defs><path d="M570,130 V290 Q570,300 580,300 H720 Q730,300 730,290 V130 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip4)"><rect x="-10" y="164" width="2000" height="156" fill="#fbd5c5" fill-opacity="1"/></g><path d="M563,127 Q570,130 570,138 V290 Q570,300 580,300 H720 Q730,300 730,290 V138 Q730,130 737,127" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><circle cx="600" cy="250" r="4" fill="#ffffff" fill-opacity="0.80" stroke="#5a7184" stroke-width="1"/><circle cx="690" cy="230" r="5" fill="#ffffff" fill-opacity="0.80" stroke="#5a7184" stroke-width="1"/><circle cx="705" cy="270" r="3" fill="#ffffff" fill-opacity="0.80" stroke="#5a7184" stroke-width="1"/><circle cx="620" cy="200" r="3" fill="#ffffff" fill-opacity="0.80" stroke="#5a7184" stroke-width="1"/><defs><clipPath id="clip5"><path d="M630,60 V250 A20,20 0 0 0 670,250 V60 Z"/></clipPath></defs><path d="M630,60 V250 A20,20 0 0 0 670,250 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip5)"><rect x="630" y="50" width="40" height="230" fill="#a0461e" stroke="none" stroke-width="0" fill-opacity="0.85"/></g><path d="M627,60 H630 V250 A20,20 0 0 0 670,250 V60 H673" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="626" y="46" width="48" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><text x="650" y="30" font-size="15" text-anchor="middle" font-weight="bold">Boiling water</text><text x="650" y="330" font-size="14" text-anchor="middle">Shift toward NO<tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">: darker</tspan></text><text x="400" y="380" font-size="18" text-anchor="end" font-weight="bold">N<tspan dy="5.8" font-size="70%">2</tspan><tspan dy="-5.8">O</tspan><tspan dy="5.8" font-size="70%">4</tspan><tspan dy="-5.8">(g)</tspan></text><path d="M410,371 H450 l-8,-5" fill="none" stroke="#1f2933" stroke-width="1.8"/><path d="M450,377 H410 l8,5" fill="none" stroke="#1f2933" stroke-width="1.8"/><text x="460" y="380" font-size="18" font-weight="bold">2NO<tspan dy="5.8" font-size="70%">2</tspan><tspan dy="-5.8">(g)</tspan></text><text x="400" y="404" font-size="13" text-anchor="middle" fill="#52606d">The forward reaction is endothermic. Same tube and contents in each view.</text>
</svg>
