<title id="t">Temperature and the N2O4 equilibrium</title>
<desc id="d">One sealed tube of N2O4 and NO2 shown in ice water, at room temperature, and in boiling water. The gas is pale in ice water, red-brown at room temperature, and darkest in boiling water.</desc>
<rect width="780" height="418" fill="#ffffff"/>
