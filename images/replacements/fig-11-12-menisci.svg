<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Menisci of water and mercury</title>
<desc id="d">Left: a glass capillary in mercury, where the mercury inside the tube stands below the outside level and has a convex surface. Right: wide glass tubes showing that water forms a concave meniscus and mercury forms a convex meniscus.</desc>
<rect width="860" height="350" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold">(a)</text><text x="52" y="30" font-size="16" font-weight="bold">Glass capillary in mercury</text><rect x="40" y="230" width="320" height="70" fill="#a9b1bb" stroke="none" stroke-width="0"/><path d="M40,170 V300 H360 V170" fill="none" stroke="#4f6475" stroke-width="2.4"/><rect x="190" y="60" width="20" height="230" fill="#f3f8fb" stroke="none" stroke-width="0"/><path d="M190,290 V270 Q200,252 210,270 V290 Z" fill="#a9b1bb" stroke="none" stroke-width="0"/><line x1="188.5" y1="60" x2="188.5" y2="290" stroke="#4f6475" stroke-width="3"/><line x1="211.5" y1="60" x2="211.5" y2="290" stroke="#4f6475" stroke-width="3"/><line x1="40" y1="230" x2="360" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="260" y="120" font-size="14">Mercury level inside</text><text x="260" y="138.2" font-size="14">the tube is lower</text><line x1="255" y1="125" x2="214" y2="262" stroke="#52606d" stroke-width="1"/><text x="60" y="222" font-size="12" fill="#c0392b">outside level</text><text x="420" y="30" font-size="16" font-weight="bold">(b)</text><text x="452" y="30" font-size="16" font-weight="bold">Meniscus shapes in glass</text><rect x="486" y="70" width="68" height="210" fill="#f3f8fb" stroke="none" stroke-width="0"/><path d="M486,280 V170 Q520,231.2 554,170 V280 Z" fill="#7fb8e6" stroke="none" stroke-width="0"/><line x1="484" y1="70" x2="484" y2="280" stroke="#4f6475" stroke-width="4"/><line x1="556" y1="70" x2="556" y2="280" stroke="#4f6475" stroke-width="4"/><rect x="686" y="70" width="68" height="210" fill="#f3f8fb" stroke="none" stroke-width="0"/><path d="M686,280 V170 Q720,108.8 754,170 V280 Z" fill="#a9b1bb" stroke="none" stroke-width="0"/><line x1="684" y1="70" x2="684" y2="280" stroke="#4f6475" stroke-width="4"/><line x1="756" y1="70" x2="756" y2="280" stroke="#4f6475" stroke-width="4"/><text x="520" y="306" font-size="14" text-anchor="middle">Water: concave</text><text x="520" y="324.2" font-size="14" text-anchor="middle">adhesion to glass is strong</text><text x="720" y="306" font-size="14" text-anchor="middle">Mercury: convex</text><text x="720" y="324.2" font-size="14" text-anchor="middle">cohesion dominates</text>
</svg>
