<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 494" width="820" height="494" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Catalysts and hydrogen peroxide</title>
<desc id="d">Three cylinders of hydrogen peroxide solution. With no catalyst nothing visible happens. With iodide the solution is brown and oxygen bubbles form. With the enzyme catalase, oxygen forms so vigorously that foam rises out of the liquid.</desc>
<rect width="820" height="494" fill="#ffffff"/>
