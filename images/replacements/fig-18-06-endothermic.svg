<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">A spontaneous endothermic reaction</title>
<desc id="d">A flask of barium hydroxide and ammonium thiocyanate sits on a wet wooden block. Arrows show heat flowing from the surroundings into the flask, the mixture becomes a slush, and the water under the flask freezes it to the wood.</desc>
<rect width="660" height="460" fill="#ffffff"/>
