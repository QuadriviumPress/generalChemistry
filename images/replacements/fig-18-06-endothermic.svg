l="#dbeafe" stroke="#7fa9d6" stroke-width="1.2"/><rect x="60" y="318" width="360" height="60" rx="4" fill="#c69c6d" stroke="#7c5a35" stroke-width="1.5"/><line x1="70" y1="330" x2="410" y2="330" stroke="#a77d4f" stroke-width="0.8"/><line x1="70" y1="340" x2="410" y2="340" stroke="#a77d4f" stroke-width="0.8"/><line x1="70" y1="350" x2="410" y2="350" stroke="#a77d4f" stroke-width="0.8"/><line x1="70" y1="360" x2="410" y2="360" stroke="#a77d4f" stroke-width="0.8"/><line x1="70" y1="370" x2="410" y2="370" stroke="#a77d4f" stroke-width="0.8"/><line x1="372" y1="309" x2="460" y2="300" stroke="#52606d" stroke-width="1"/><text x="466" y="296" font-size="14">Water under the flask</text><text x="466" y="314.2" font-size="14">freezes; flask sticks</text><text x="466" y="332.4" font-size="14">to the wood</text><line x1="70" y1="170" x2="127" y2="206.7" stroke="#c0392b" stroke-width="2.2"/><polygon points="132,210 122.1,208.6 126.7,201.5" fill="#c0392b"/><line x1="410" y1="170" x2="353" y2="206.7" stroke="#c0392b" stroke-width="2.2"/><polygon points="348,210 353.3,201.5 357.9,208.6" fill="#c0392b"/><line x1="90" y1="260" x2="134.1" y2="267.1" stroke="#c0392b" stroke-width="2.2"/><polygon points="140,268 130.4,270.7 131.7,262.4" fill="#c0392b"/><line x1="395" y1="262" x2="351" y2="267.3" stroke="#c0392b" stroke-width="2.2"/><polygon points="345,268 353.5,262.7 354.5,271.1" fill="#c0392b"/><text x="466" y="160" font-size="14" fill="#c0392b">Heat flows from the</text><text x="466" y="178.2" font-size="14" fill="#c0392b">surroundings into</text><text x="466" y="196.4" font-size="14" fill="#c0392b">the reaction mixture</text><line x1="320" y1="240" x2="460" y2="230" stroke="#52606d" stroke-width="1"/><text x="466" y="236" font-size="14">Slushy solid forms</text><text x="466" y="254.2" font-size="14">as the mixture cools</text><text x="320" y="418" font-size="15" text-anchor="middle" font-weight="bold">Ba(OH)<tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">·8H</tspan><tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">O(s) + 2NH</tspan><tspan dy="4.8" font-size="70%">4</tspan><tspan dy="-4.8">SCN(s) → Ba(SCN)</tspan><tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">(aq) + 2NH</tspan><tspan dy="4.8" font-size="70%">3</tspan><tspan dy="-4.8">(aq) + 10H</tspan><tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">O(l)</tspan></text><text x="320" y="442" font-size="14" text-anchor="middle">ΔH &gt; 0 (endothermic), yet the reaction is spontaneous.</text>
</svg>
