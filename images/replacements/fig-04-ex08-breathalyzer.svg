<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Breathalyzer color change</title>
<desc id="d">Two sealed ampuls. Before, the dichromate solution is yellow-orange. After breath containing ethanol is bubbled through it, ethanol is oxidized to acetic acid, chromium(VI) is reduced to chromium(III), and the solution is green.</desc>
<rect width="700" height="370" fill="#ffffff"/>
<text x="60" y="30" font-size="16" font-weight="bold">(a) Before</text><text x="470" y="30" font-size="16" font-weight="bold">(b) After</text><defs><clipPath id="clip1"><path d="M117,70 V237 A23,23 0 0 0 163,237 V70 Z"/></clipPath></defs><path d="M117,70 V237 A23,23 0 0 0 163,237 V70 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="123.2" width="2000" height="156.8" fill="#f2a33a" fill-opacity="0.95"/></g><path d="M114,70 H117 V237 A23,23 0 0 0 163,237 V70 H166" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="113" y="56" width="54" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><defs><clipPath id="clip2"><path d="M537,70 V237 A23,23 0 0 0 583,237 V70 Z"/></clipPath></defs><path d="M537,70 V237 A23,23 0 0 0 583,237 V70 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="123.2" width="2000" height="156.8" fill="#6aa84f" fill-opacity="0.95"/></g><path d="M534,70 H537 V237 A23,23 0 0 0 583,237 V70 H586" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="533" y="56" width="54" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><text x="140" y="298" font-size="15" text-anchor="middle">Cr<tspan dy="4.8" font-size="70%">2</tspan><tspan dy="-4.8">O</tspan><tspan dy="4.8" font-size="70%">7</tspan><tspan dy="-11.1" font-size="70%">2−</tspan><tspan dy="6.3"> (Cr</tspan><tspan dy="-6.3" font-size="70%">6+</tspan><tspan dy="6.3">)</tspan></text><text x="140" y="317.5" font-size="15" text-anchor="middle">yellow-orange</text><text x="560" y="298" font-size="15" text-anchor="middle">Cr<tspan dy="-6.3" font-size="70%">3+</tspan></text><text x="560" y="317.5" font-size="15" text-anchor="middle">green</text><line x1="220" y1="160" x2="472.8" y2="160" stroke="#1f2933" stroke-width="2.5"/><polygon points="480,160 469.1,165.1 469.1,154.9" fill="#1f2933"/><text x="350" y="110" font-size="14" text-anchor="middle">Breath containing ethanol</text><text x="350" y="128.2" font-size="14" text-anchor="middle">is bubbled through</text><text x="350" y="190" font-size="14" text-anchor="middle">CH<tspan dy="4.5" font-size="70%">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">OH → CH</tspan><tspan dy="4.5" font-size="70%">3</tspan><tspan dy="-4.5">COOH</tspan></text><text x="350" y="208.2" font-size="14" text-anchor="middle">(ethanol oxidized)</text><text x="350" y="236" font-size="14" text-anchor="middle">Cr<tspan dy="-5.9" font-size="70%">6+</tspan><tspan dy="5.9"> → Cr</tspan><tspan dy="-5.9" font-size="70%">3+</tspan></text><text x="350" y="254.2" font-size="14" text-anchor="middle">(chromium reduced)</text><text x="350" y="350" font-size="13" text-anchor="middle" fill="#52606d">Schematic of the historical dichromate test; colors are qualitative.</text>
</svg>
