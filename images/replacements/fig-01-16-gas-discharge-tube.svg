<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Gas discharge tube</title>
<desc id="d">A sealed glass tube of low-pressure gas has a cathode at the left and an anode at the right, both wired to a high-voltage supply. Arrows inside show electrons moving from cathode to anode, and arrows outside show light emitted by the glowing gas.</desc>
