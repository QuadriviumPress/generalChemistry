<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 418" width="820" height="418" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Zinc in copper(II) sulfate</title>
<desc id="d">A zinc strip stands in blue copper(II) sulfate solution in one beaker and becomes coated with fine black copper particles. A particle view shows zinc atoms leaving as zinc ions while copper(II) ions gain electrons directly at the zinc surface and deposit as copper.</desc>
