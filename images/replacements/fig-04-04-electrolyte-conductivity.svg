<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 440" width="890" height="440" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Electrolytes and conductivity</title>
<desc id="d">Three identical circuits each contain a battery, a light bulb, and two electrodes in a beaker. With a nonelectrolyte the beaker holds only neutral molecules and the bulb is off. With a weak electrolyte it holds mostly molecules and one ion pair, and the bulb glows dimly. With a strong electrolyte it holds only ions, and the bulb shines brightly.</desc>
