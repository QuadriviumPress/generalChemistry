<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 410" width="890" height="410" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Copper displacing silver</title>
<desc id="d">A copper coil in colorless silver nitrate solution becomes coated with silver crystals as the solution turns blue. A particle view shows silver ions gaining electrons to deposit as silver atoms on the copper surface while copper atoms leave as copper(II) ions.</desc>
