<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" width="700" height="490" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Permanganate titration of oxalic acid</title>
<desc id="d">Two titration setups with purple permanganate solution in a buret. Before the endpoint, a purple plume appears where the drop enters the nearly colorless oxalic acid solution and then fades. At the endpoint, the whole solution is faintly purple.</desc>
<rect width="700" height="490" fill="#ffffff"/>
<text x="40" y="30" font-size="16" font-weight="bold">(a)</text><text x="72" y="30" font-size="16" font-weight="bold">Before the endpoint</text><rect x="171" y="50" width="18" height="170" rx="2" fill="#f3f8fb" stroke="#4f6475" stroke-width="1.8"/><rect x="173" y="92.5" width="14" height="125.5" fill="#8e2a8e" stroke="none" stroke-width="0" fill-opacity="0.9"/><line x1="171" y1="71.2" x2="177" y2="71.2" stroke="#4f6475" stroke-width="1"/><line x1="171" y1="92.5" x2="177" y2="92.5" stroke="#4f6475" stroke-width="1"/><line x1="171" y1="113.8" x2="177" y2="113.8" stroke="#4f6475" stroke-width="1"/><line x1="171" y1="135" x2="177" y2="135" stroke="#4f6475" stroke-width="1"/><line x1="171" y1="156.2" x2="177" y2="156.2" stroke="#4f6475" stroke-width="1"/><line x1="171" y1="177.5" x2="177" y2="177.5" stroke="#4f6475" stroke-width="1"/><line x1="171" y1="198.8" x2="177" y2="198.8" stroke="#4f6475" stroke-width="1"/><rect x="167" y="220" width="26" height="10" rx="2" fill="#9aa5b1" stroke="#1f2933" stroke-width="1.2"/><path d="M177,230 V254 l3,6 3,-6 V230" fill="#f3f8fb" stroke="#4f6475" stroke-width="1.5"/><text x="205" y="120" font-size="14">KMnO<tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-4.5">(aq)</tspan></text><defs><clipPath id="clip1"><path d="M160,270 V320 L97,412 Q95,420 103,420 H257 Q265,420 263,412 L200,320 V270 Z"/></clipPath></defs><path d="M160,270 V320 L97,412 Q95,420 103,420 H257 Q265,420 263,412 L200,320 V270 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="360" width="2000" height="80" fill="#e6edf2" fill-opacity="1"/><defs><radialGradient id="pl"><stop offset="0" stop-color="#8e2a8e" stop-opacity="0.85"/><stop offset="1" stop-color="#8e2a8e" stop-opacity="0"/></radialGradient></defs><ellipse cx="180" cy="378" rx="34" ry="16" fill="url(#pl)"/></g><path d="M155,270 H160 V320 L97,412 Q95,420 103,420 H257 Q265,420 263,412 L200,320 V270 H205" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="180" y="452" font-size="14" text-anchor="middle">Purple appears where titrant enters,</text><text x="180" y="470.2" font-size="14" text-anchor="middle">then fades as MnO<tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-10.4" font-size="70%">−</tspan><tspan dy="5.9"> is consumed</tspan></text><text x="180" y="408" font-size="13" text-anchor="middle" fill="#52606d">oxalic acid solution</text><text x="370" y="30" font-size="16" font-weight="bold">(b)</text><text x="402" y="30" font-size="16" font-weight="bold">At the endpoint</text><rect x="501" y="50" width="18" height="170" rx="2" fill="#f3f8fb" stroke="#4f6475" stroke-width="1.8"/><rect x="503" y="92.5" width="14" height="125.5" fill="#8e2a8e" stroke="none" stroke-width="0" fill-opacity="0.9"/><line x1="501" y1="71.2" x2="507" y2="71.2" stroke="#4f6475" stroke-width="1"/><line x1="501" y1="92.5" x2="507" y2="92.5" stroke="#4f6475" stroke-width="1"/><line x1="501" y1="113.8" x2="507" y2="113.8" stroke="#4f6475" stroke-width="1"/><line x1="501" y1="135" x2="507" y2="135" stroke="#4f6475" stroke-width="1"/><line x1="501" y1="156.2" x2="507" y2="156.2" stroke="#4f6475" stroke-width="1"/><line x1="501" y1="177.5" x2="507" y2="177.5" stroke="#4f6475" stroke-width="1"/><line x1="501" y1="198.8" x2="507" y2="198.8" stroke="#4f6475" stroke-width="1"/><rect x="497" y="220" width="26" height="10" rx="2" fill="#9aa5b1" stroke="#1f2933" stroke-width="1.2"/><path d="M507,230 V254 l3,6 3,-6 V230" fill="#f3f8fb" stroke="#4f6475" stroke-width="1.5"/><text x="535" y="120" font-size="14">KMnO<tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-4.5">(aq)</tspan></text><defs><clipPath id="clip2"><path d="M490,270 V320 L427,412 Q425,420 433,420 H587 Q595,420 593,412 L530,320 V270 Z"/></clipPath></defs><path d="M490,270 V320 L427,412 Q425,420 433,420 H587 Q595,420 593,412 L530,320 V270 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="360" width="2000" height="80" fill="#ecc8e9" fill-opacity="1"/></g><path d="M485,270 H490 V320 L427,412 Q425,420 433,420 H587 Q595,420 593,412 L530,320 V270 H535" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="510" y="452" font-size="14" text-anchor="middle">Faint purple persists throughout:</text><text x="510" y="470.2" font-size="14" text-anchor="middle">excess MnO<tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-10.4" font-size="70%">−</tspan><tspan dy="5.9"> marks the endpoint</tspan></text><text x="510" y="408" font-size="13" text-anchor="middle" fill="#52606d">oxalic acid solution</text>
</svg>
