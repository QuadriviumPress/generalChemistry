<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 446" width="840" height="446" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Galvanic cell with a salt bridge</title>
<desc id="d">A zinc electrode in zinc ion solution and a copper electrode in copper(II) ion solution are joined by a wire through a voltmeter and by a salt bridge. Electrons flow through the wire from zinc to copper; in the salt bridge, anions move toward the zinc compartment and cations toward the copper compartment.</desc>
<rect width="840" height="446" fill="#ffffff"/>
<defs><clipPath id="clip1"><path d="M60,170 V360 Q60,370 70,370 H270 Q280,370 280,360 V170 Z"/></clipPath></defs><path d="M60,170 V360 Q60,370 70,370 H270 Q280,370 280,360 V170 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="220" width="2000" height="170" fill="#e6ebf0" fill-opacity="1"/></g><path d="M53,167 Q60,170 60,178 V360 Q60,370 70,370 H270 Q280,370 280,360 V178 Q280,170 287,167" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><defs><clipPath id="clip2"><path d="M560,170 V360 Q560,370 570,370 H770 Q780,370 780,360 V170 Z"/></clipPath></defs><path d="M560,170 V360 Q560,370 570,370 H770 Q780,370 780,360 V170 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="220" width="2000" height="170" fill="#6fa8dc" fill-opacity="0.9"/></g><path d="M553,167 Q560,170 560,178 V360 Q560,370 570,370 H770 Q780,370 780,360 V178 Q780,170 787,167" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="158" y="120" width="24" height="220" rx="2" fill="#b8c0c8" stroke="#52606d" stroke-width="1.4"/><rect x="658" y="120" width="24" height="220" rx="2" fill="#c4773b" stroke="#7a4a23" stroke-width="1.4"/><path d="M240,330 V150 Q240,110 280,110 H560 Q600,110 600,150 V330" fill="none" stroke="#4f6475" stroke-width="34" stroke-linejoin="round"/><path d="M240,330 V150 Q240,110 280,110 H560 Q600,110 600,150 V330" fill="none" stroke="#f4ecd8" stroke-width="28"/><line x1="480" y1="104" x2="364.8" y2="104" stroke="#3d7fc4" stroke-width="2"/><polygon points="360,104 367.3,100.6 367.3,107.4" fill="#3d7fc4"/><line x1="360" y1="117" x2="475.2" y2="117" stroke="#c0392b" stroke-width="2"/><polygon points="480,117 472.7,120.4 472.7,113.6" fill="#c0392b"/><text x="420" y="172" font-size="14" text-anchor="middle" font-weight="bold">Salt bridge (e.g., KNO<tspan dy="4.5" font-size="70%">3</tspan><tspan dy="-4.5"> or Na</tspan><tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">SO</tspan><tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-4.5">)</tspan></text><text x="420" y="198" font-size="13" text-anchor="middle" fill="#3d7fc4">anions move toward the Zn compartment</text><text x="420" y="220" font-size="13" text-anchor="middle" fill="#c0392b">cations move toward the Cu compartment</text><path d="M170,120 V40 H380" fill="none" stroke="#1f2933" stroke-width="2"/><path d="M460,40 H670 V120" fill="none" stroke="#1f2933" stroke-width="2"/><circle cx="420" cy="40" r="30" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><text x="420" y="47" font-size="20" text-anchor="middle" font-weight="bold">V</text><line x1="220" y1="26" x2="314.6" y2="26" stroke="#1d4f80" stroke-width="2"/><polygon points="320,26 311.8,29.8 311.8,22.2" fill="#1d4f80"/><line x1="520" y1="26" x2="614.6" y2="26" stroke="#1d4f80" stroke-width="2"/><polygon points="620,26 611.8,29.8 611.8,22.2" fill="#1d4f80"/><text x="270" y="18" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d4f80">e<tspan dy="-5.9" font-size="70%">−</tspan></text><text x="570" y="18" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d4f80">e<tspan dy="-5.9" font-size="70%">−</tspan></text><text x="170" y="400" font-size="14" text-anchor="middle">Anode: Zn(s) in Zn<tspan dy="-5.9" font-size="70%">2+</tspan><tspan dy="5.9">(aq)</tspan></text><text x="170" y="418.2" font-size="14" text-anchor="middle">Zn(s) → Zn<tspan dy="-5.9" font-size="70%">2+</tspan><tspan dy="5.9">(aq) + 2e</tspan><tspan dy="-5.9" font-size="70%">−</tspan></text><text x="670" y="400" font-size="14" text-anchor="middle">Cathode: Cu(s) in Cu<tspan dy="-5.9" font-size="70%">2+</tspan><tspan dy="5.9">(aq)</tspan></text><text x="670" y="418.2" font-size="14" text-anchor="middle">Cu<tspan dy="-5.9" font-size="70%">2+</tspan><tspan dy="5.9">(aq) + 2e</tspan><tspan dy="-5.9" font-size="70%">−</tspan><tspan dy="5.9"> → Cu(s)</tspan></text>
</svg>
