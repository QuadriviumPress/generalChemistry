<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Dichromate and iodide</title>
<desc id="d">A yellow sodium dichromate solution and a colorless sodium iodide solution are combined under acidic conditions to give a deep amber mixture containing green chromium(III) and brown iodine. Iodide is oxidized to iodine and chromium is reduced from +6 to +3.</desc>
<rect width="720" height="400" fill="#ffffff"/>
<defs><clipPath id="clip1"><path d="M30,60 V200 Q30,210 40,210 H170 Q180,210 180,200 V60 Z"/></clipPath></defs><path d="M30,60 V200 Q30,210 40,210 H170 Q180,210 180,200 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="105" width="2000" height="125" fill="#f2b134" fill-opacity="0.95"/></g><path d="M23,57 Q30,60 30,68 V200 Q30,210 40,210 H170 Q180,210 180,200 V68 Q180,60 187,57" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="105" y="236" font-size="14" text-anchor="middle">Na<tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">Cr</tspan><tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">O</tspan><tspan dy="4.5" font-size="70%">7</tspan><tspan dy="-4.5">(aq)</tspan></text><text x="105" y="254.2" font-size="14" text-anchor="middle">yellow</text><text x="205" y="140" font-size="26" text-anchor="middle" font-weight="bold">+</text><defs><clipPath id="clip2"><path d="M230,60 V200 Q230,210 240,210 H370 Q380,210 380,200 V60 Z"/></clipPath></defs><path d="M230,60 V200 Q230,210 240,210 H370 Q380,210 380,200 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="105" width="2000" height="125" fill="#f3f6f8" fill-opacity="1"/></g><path d="M223,57 Q230,60 230,68 V200 Q230,210 240,210 H370 Q380,210 380,200 V68 Q380,60 387,57" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="305" y="236" font-size="14" text-anchor="middle">NaI(aq)</text><text x="305" y="254.2" font-size="14" text-anchor="middle">colorless</text><line x1="400" y1="135" x2="462.8" y2="135" stroke="#1f2933" stroke-width="2.5"/><polygon points="470,135 459.1,140.1 459.1,129.9" fill="#1f2933"/><text x="435" y="120" font-size="12" text-anchor="middle" font-style="italic">acidic</text><defs><clipPath id="clip3"><path d="M490,40 V210 Q490,220 500,220 H680 Q690,220 690,210 V40 Z"/></clipPath></defs><path d="M490,40 V210 Q490,220 500,220 H680 Q690,220 690,210 V40 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip3)"><rect x="-10" y="90.4" width="2000" height="149.6" fill="#8a4b14" fill-opacity="0.9"/></g><path d="M483,37 Q490,40 490,48 V210 Q490,220 500,220 H680 Q690,220 690,210 V48 Q690,40 697,37" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="590" y="246" font-size="14" text-anchor="middle">Deep amber mixture:</text><text x="590" y="264.2" font-size="14" text-anchor="middle">green Cr<tspan dy="-5.9" font-size="70%">3+</tspan><tspan dy="5.9">(aq) and brown I</tspan><tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">(aq)</tspan></text><text x="360" y="314" font-size="15" text-anchor="middle" font-weight="bold">Electron transfer</text><text x="360" y="338" font-size="14" text-anchor="middle">I<tspan dy="-5.9" font-size="70%">−</tspan><tspan dy="5.9"> loses electrons (oxidized) → I</tspan><tspan dy="4.5" font-size="70%">2</tspan></text><text x="360" y="360" font-size="14" text-anchor="middle">Cr in Cr<tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">O</tspan><tspan dy="4.5" font-size="70%">7</tspan><tspan dy="-10.4" font-size="70%">2−</tspan><tspan dy="5.9"> (+6) gains electrons (reduced) → Cr</tspan><tspan dy="-5.9" font-size="70%">3+</tspan><tspan dy="5.9"> (+3)</tspan></text><text x="360" y="386" font-size="12" text-anchor="middle" fill="#52606d">Colors are schematic.</text>
</svg>
