<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Distillation of salt water</title>
<desc id="d">A burner heats salt water in a distilling flask with a thermometer. Water vapor passes into a sloping condenser cooled by water that enters at the lower end and leaves at the upper end. Condensed water drips into a receiving flask while the salt stays behind.</desc>
