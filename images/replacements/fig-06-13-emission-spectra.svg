<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Hydrogen, neon, and mercury spectra</title>
<desc id="d">Three emission line spectra on a shared 400 to 700 nanometer scale. Hydrogen has four lines. Neon has many lines, mostly in the yellow, orange, and red. Mercury has violet lines near 405 and 436 nanometers, a green line at 546 nanometers, and a yellow pair near 577 and 579 nanometers.</desc>
