<title id="t">Ammonium dichromate decomposition</title>
<desc id="d">An orange pile of ammonium dichromate is heated and becomes a larger green pile of chromium(III) oxide while nitrogen gas and water vapor escape. Below, the balanced equation and a table show 2 N, 8 H, 2 Cr, and 7 O atoms on each side.</desc>
