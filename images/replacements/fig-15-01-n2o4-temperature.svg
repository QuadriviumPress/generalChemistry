<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Dinitrogen tetroxide warming</title>
<desc id="d">Three views of one sealed tube. In dry ice it holds colorless solid N2O4. As it warms above minus 9.3 degrees Celsius, the N2O4 melts and evaporates and the gas turns pale brown. At room temperature it holds a red-brown equilibrium mixture of N2O4 and NO2 gas.</desc>
<rect width="800" height="424" fill="#ffffff"/>
