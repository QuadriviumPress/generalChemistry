="0.0"/><path d="M108,270 V236 L122,230 L134,238 L152,232 V270 Z" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/></g><path d="M105,60 H108 V248 A22,22 0 0 0 152,248 V60 H155" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="104" y="46" width="52" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><text x="130" y="324" font-size="14" text-anchor="middle">Colorless solid N<tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">O</tspan><tspan dy="4.5" font-size="70%">4</tspan></text><line x1="200" y1="160" x2="324" y2="160" stroke="#1f2933" stroke-width="2"/><polygon points="330,160 320.9,164.2 320.9,155.8" fill="#1f2933"/><text x="400" y="30" font-size="15" text-anchor="middle" font-weight="bold">Warming above −9.3 °C</text><defs><clipPath id="clip2"><path d="M378,60 V248 A22,22 0 0 0 422,248 V60 Z"/></clipPath></defs><path d="M378,60 V248 A22,22 0 0 0 422,248 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="378" y="50" width="44" height="230" fill="#a0461e" stroke="none" stroke-width="0" fill-opacity="0.25"/><rect x="378" y="240" width="44" height="40" fill="#f4ecd8" stroke="#c9b98f" stroke-width="1"/></g><path d="M375,60 H378 V248 A22,22 0 0 0 422,248 V60 H425" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="374" y="46" width="52" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><text x="400" y="324" font-size="14" text-anchor="middle">N<tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">O</tspan><tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-4.5"> melts and evaporates;</tspan></text><text x="400" y="342.2" font-size="14" text-anchor="middle">some vapor forms NO<tspan dy="4.5" font-size="70%">2</tspan></text><line x1="470" y1="160" x2="594" y2="160" stroke="#1f2933" stroke-width="2"/><polygon points="600,160 590.9,164.2 590.9,155.8" fill="#1f2933"/><text x="670" y="30" font-size="15" text-anchor="middle" font-weight="bold">Room temperature</text><defs><clipPath id="clip3"><path d="M648,60 V248 A22,22 0 0 0 692,248 V60 Z"/></clipPath></defs><path d="M648,60 V248 A22,22 0 0 0 692,248 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip3)"><rect x="648" y="50" width="44" height="230" fill="#a0461e" stroke="none" stroke-width="0" fill-opacity="0.6"/></g><path d="M645,60 H648 V248 A22,22 0 0 0 692,248 V60 H695" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><rect x="644" y="46" width="52" height="16" rx="3" fill="#7b8794" stroke="#3e4c59" stroke-width="1.2"/><text x="670" y="324" font-size="14" text-anchor="middle">N<tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">O</tspan><tspan dy="4.5" font-size="70%">4</tspan><tspan dy="-4.5">(g) and NO</tspan><tspan dy="4.5" font-size="70%">2</tspan><tspan dy="-4.5">(g)</tspan></text><text x="670" y="342.2" font-size="14" text-anchor="middle">at equilibrium</text><text x="400" y="392" font-size="18" text-anchor="end" font-weight="bold">N<tspan dy="5.8" font-size="70%">2</tspan><tspan dy="-5.8">O</tspan><tspan dy="5.8" font-size="70%">4</tspan><tspan dy="-5.8">(g)</tspan></text><path d="M410,383 H450 l-8,-5" fill="none" stroke="#1f2933" stroke-width="1.8"/><path d="M450,389 H410 l8,5" fill="none" stroke="#1f2933" stroke-width="1.8"/><text x="460" y="392" font-size="18" font-weight="bold">2NO<tspan dy="5.8" font-size="70%">2</tspan><tspan dy="-5.8">(g)</tspan></text><text x="358" y="412" font-size="13" text-anchor="middle" fill="#52606d">colorless</text><text x="498" y="412" font-size="13" text-anchor="middle" fill="#a0461e">red-brown</text>
</svg>
