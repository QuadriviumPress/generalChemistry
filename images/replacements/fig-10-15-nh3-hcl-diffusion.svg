<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Ammonia and hydrogen chloride diffusion</title>
<desc id="d">Open containers of aqueous ammonia on the left and hydrochloric acid on the right release gas molecules that diffuse toward each other. Where they meet, closer to the hydrochloric acid, they form a white cloud of solid ammonium chloride.</desc>
