<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Carbon dioxide and silicon dioxide</title>
<desc id="d">Left: dry ice drawn as separate linear O=C=O molecules joined to each other only by weak intermolecular forces; it sublimes at minus 78 degrees Celsius. Right: quartz drawn as a continuous network in which every silicon atom is bonded to oxygen atoms that bridge to other silicon atoms; it is hard and high melting.</desc>
