<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 405" width="860" height="405" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Hydrogen emission spectrum</title>
<desc id="d">A hydrogen discharge tube glows red. Its light passes through a slit and a prism, which separates it into four lines on a 400 to 700 nanometer scale: violet at 410.2, violet at 434.0, blue-green at 486.1, and red at 656.3 nanometers, the most intense.</desc>
<rect width="860" height="405" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold">(a)</text><text x="52" y="30" font-size="16" font-weight="bold">Excited hydrogen atoms</text><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8457d" stop-opacity="0.45"/><stop offset="0.5" stop-color="#e8457d" stop-opacity="0.95"/><stop offset="1" stop-color="#e8457d" stop-opacity="0.45"/></linearGradient></defs><rect x="40" y="90" width="200" height="40" rx="20" fill="url(#hg)" stroke="#4f6475" stroke-width="2"/><rect x="30" y="96" width="14" height="28" fill="#7b8794" stroke="#1f2933" stroke-width="1"/><rect x="236" y="96" width="14" height="28" fill="#7b8794" stroke="#1f2933" stroke-width="1"/><text x="140" y="160" font-size="14" text-anchor="middle">Hydrogen discharge tube</text><text x="140" y="178.2" font-size="14" text-anchor="middle">glows red</text><text x="300" y="30" font-size="16" font-weight="bold">(b)</text><text x="332" y="30" font-size="16" font-weight="bold">Light split by a prism</text><line x1="240" y1="110" x2="330" y2="110" stroke="#e8457d" stroke-width="3"/><rect x="330" y="92" width="6" height="14" fill="#1f2933" stroke="none" stroke-width="0"/><rect x="330" y="114" width="6" height="14" fill="#1f2933" stroke="none" stroke-width="0"/><text x="333" y="84" font-size="12" text-anchor="middle">slit</text><path d="M400,145 L440,70 L480,145 Z" fill="#e3eef6" stroke="#4f6475" stroke-width="2"/><text x="392" y="140" font-size="12" text-anchor="end">prism</text><line x1="336" y1="110" x2="420" y2="110" stroke="#e8457d" stroke-width="3"/><line x1="462" y1="112" x2="318.3" y2="260" stroke="#7d00db" stroke-width="2"/><line x1="462" y1="112" x2="361.3" y2="260" stroke="#2800ff" stroke-width="2"/><line x1="462" y1="112" x2="455" y2="260" stroke="#00efff" stroke-width="2"/><line x1="462" y1="112" x2="761.3" y2="260" stroke="#ff0000" stroke-width="2"/><rect x="300" y="260" width="540" height="50" fill="#111827" stroke="#111827" stroke-width="1"/><rect x="316.3" y="262" width="4" height="46" fill="#7d00db" stroke="none" stroke-width="0"/><rect x="359.3" y="262" width="4" height="46" fill="#2800ff" stroke="none" stroke-width="0"/><rect x="453" y="262" width="4" height="46" fill="#00efff" stroke="none" stroke-width="0"/><rect x="759.3" y="262" width="4" height="46" fill="#ff0000" stroke="none" stroke-width="0"/><line x1="300" y1="310" x2="300" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="300" y="332" font-size="13" text-anchor="middle">400</text><line x1="390" y1="310" x2="390" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="390" y="332" font-size="13" text-anchor="middle">450</text><line x1="480" y1="310" x2="480" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="480" y="332" font-size="13" text-anchor="middle">500</text><line x1="570" y1="310" x2="570" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="570" y="332" font-size="13" text-anchor="middle">550</text><line x1="660" y1="310" x2="660" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="660" y="332" font-size="13" text-anchor="middle">600</text><line x1="750" y1="310" x2="750" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="750" y="332" font-size="13" text-anchor="middle">650</text><line x1="840" y1="310" x2="840" y2="317" stroke="#1f2933" stroke-width="1.2"/><text x="840" y="332" font-size="13" text-anchor="middle">700</text><text x="315.3" y="252" font-size="12" text-anchor="end" font-weight="bold">410.2</text><text x="364.3" y="252" font-size="12" font-weight="bold">434.0</text><text x="455" y="252" font-size="12" text-anchor="middle" font-weight="bold">486.1</text><text x="761.3" y="252" font-size="12" text-anchor="middle" font-weight="bold">656.3</text><text x="570" y="352" font-size="14" text-anchor="middle">Wavelength (nm)</text><text x="761.3" y="234" font-size="12" text-anchor="middle" fill="#b91c1c">most intense</text><text x="430" y="392" font-size="12" text-anchor="middle" fill="#52606d">Line positions from NIST atomic data; line colors are display approximations.</text>
</svg>
