<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 406" width="840" height="406" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Indicator colors from pH 1 to 10</title>
<desc id="d">Seven color bars across pH 1 to 10. Thymol blue changes red to yellow near pH 1.2 to 2.8 and yellow to blue near 8.0 to 9.6. Bromophenol blue goes yellow to blue, methyl red red to yellow, bromocresol purple yellow to purple, bromothymol blue yellow to blue, phenol red yellow to red, and phenolphthalein colorless to pink, each over its own range.</desc>
<rect width="840" height="406" fill="#ffffff"/>
<defs><linearGradient id="ind1" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d7301f"/><stop offset="0.2" stop-color="#f2d22e"/><stop offset="0.8" stop-color="#f2d22e"/><stop offset="1" stop-color="#2b6cb0"/></linearGradient></defs><rect x="190" y="20" width="620" height="30" rx="4" fill="url(#ind1)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="40" font-size="14" text-anchor="end" font-weight="bold">Thymol blue</text><defs><linearGradient id="ind2" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0.2" stop-color="#f2d22e"/><stop offset="0.4" stop-color="#2b6cb0"/></linearGradient></defs><rect x="190" y="64" width="620" height="30" rx="4" fill="url(#ind2)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="84" font-size="14" text-anchor="end" font-weight="bold">Bromophenol blue</text><defs><linearGradient id="ind3" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0.4" stop-color="#d7301f"/><stop offset="0.6" stop-color="#f2d22e"/></linearGradient></defs><rect x="190" y="108" width="620" height="30" rx="4" fill="url(#ind3)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="128" font-size="14" text-anchor="end" font-weight="bold">Methyl red</text><defs><linearGradient id="ind4" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0.5" stop-color="#f2d22e"/><stop offset="0.6" stop-color="#7b3294"/></linearGradient></defs><rect x="190" y="152" width="620" height="30" rx="4" fill="url(#ind4)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="172" font-size="14" text-anchor="end" font-weight="bold">Bromocresol purple</text><defs><linearGradient id="ind5" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0.6" stop-color="#f2d22e"/><stop offset="0.7" stop-color="#2b6cb0"/></linearGradient></defs><rect x="190" y="196" width="620" height="30" rx="4" fill="url(#ind5)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="216" font-size="14" text-anchor="end" font-weight="bold">Bromothymol blue</text><defs><linearGradient id="ind6" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0.6" stop-color="#f2d22e"/><stop offset="0.8" stop-color="#d7301f"/></linearGradient></defs><rect x="190" y="240" width="620" height="30" rx="4" fill="url(#ind6)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="260" font-size="14" text-anchor="end" font-weight="bold">Phenol red</text><defs><linearGradient id="ind7" x1="190" x2="810" gradientUnits="userSpaceOnUse"><stop offset="0.8" stop-color="#f7f7f7"/><stop offset="1" stop-color="#e0218a"/></linearGradient></defs><rect x="190" y="284" width="620" height="30" rx="4" fill="url(#ind7)" stroke="#9aa5b1" stroke-width="1"/><text x="178" y="304" font-size="14" text-anchor="end" font-weight="bold">Phenolphthalein</text><line x1="190" y1="322" x2="190" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="190" y="346" font-size="13" text-anchor="middle">1</text><line x1="258.9" y1="322" x2="258.9" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="258.9" y="346" font-size="13" text-anchor="middle">2</text><line x1="327.8" y1="322" x2="327.8" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="327.8" y="346" font-size="13" text-anchor="middle">3</text><line x1="396.7" y1="322" x2="396.7" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="396.7" y="346" font-size="13" text-anchor="middle">4</text><line x1="465.6" y1="322" x2="465.6" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="465.6" y="346" font-size="13" text-anchor="middle">5</text><line x1="534.4" y1="322" x2="534.4" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="534.4" y="346" font-size="13" text-anchor="middle">6</text><line x1="603.3" y1="322" x2="603.3" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="603.3" y="346" font-size="13" text-anchor="middle">7</text><line x1="672.2" y1="322" x2="672.2" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="672.2" y="346" font-size="13" text-anchor="middle">8</text><line x1="741.1" y1="322" x2="741.1" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="741.1" y="346" font-size="13" text-anchor="middle">9</text><line x1="810" y1="322" x2="810" y2="330" stroke="#1f2933" stroke-width="1.2"/><text x="810" y="346" font-size="13" text-anchor="middle">10</text><text x="500" y="368" font-size="14" text-anchor="middle" font-weight="bold">pH</text><text x="430" y="392" font-size="12" text-anchor="middle" fill="#52606d">Transition ranges follow Figure 16.23; colors are approximate.</text>
</svg>
