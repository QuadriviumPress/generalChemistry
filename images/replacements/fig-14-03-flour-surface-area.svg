<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" width="820" height="432" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Surface area and reaction rate</title>
