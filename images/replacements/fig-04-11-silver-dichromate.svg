<title id="t">Silver dichromate precipitation</title>
<desc id="d">A beaker of silver and nitrate ions is mixed with a beaker of potassium and dichromate ions. In the product beaker, four silver ions and two dichromate ions form a red solid at the bottom, while four potassium ions and four nitrate ions remain dissolved.</desc>
