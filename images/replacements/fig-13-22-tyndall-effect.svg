l="#fff7cc"/><line x1="653" y1="178" x2="658.2" y2="200.5" stroke="#fff7cc" stroke-width="1.2"/><polygon points="659,204 655.3,199.3 660.2,198.1" fill="#fff7cc"/><line x1="670" y1="166" x2="664.8" y2="143.5" stroke="#fff7cc" stroke-width="1.2"/><polygon points="664,140 667.7,144.7 662.8,145.9" fill="#fff7cc"/><line x1="678" y1="178" x2="683.2" y2="200.5" stroke="#fff7cc" stroke-width="1.2"/><polygon points="684,204 680.3,199.3 685.2,198.1" fill="#fff7cc"/><text x="300" y="312" font-size="14" text-anchor="middle" font-weight="bold" fill="#f7fafc">True solution: beam not visible</text><text x="620" y="312" font-size="14" text-anchor="middle" font-weight="bold" fill="#f7fafc">Colloid (with gelatin): beam scattered</text><text x="300" y="34" font-size="13" text-anchor="middle" fill="#e4e7eb">Red food coloring in water</text><text x="620" y="34" font-size="13" text-anchor="middle" fill="#e4e7eb">Same solution plus gelatin</text><text x="430" y="350" font-size="12" text-anchor="middle" fill="#52606d">Dotted line marks the beam path through air and the true solution, where it is not seen from the side.</text>
