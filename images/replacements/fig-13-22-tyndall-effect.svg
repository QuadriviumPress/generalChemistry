<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 364" width="860" height="364" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Tyndall effect</title>
<desc id="d">A light beam crosses two cylinders of red food coloring in water. In the true solution on the left the beam cannot be seen from the side. In the cylinder on the right, which also contains gelatin, the beam is visible because the colloidal particles scatter light.</desc>
<rect width="860" height="364" fill="#ffffff"/>
