<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" width="860" height="384" role="img" aria-labelledby="t d" font-family="&#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Crown ether dissolves permanganate</title>
<desc id="d">First tube: dark purple potassium permanganate crystals sit undissolved in colorless isopropanol. Second tube: with a little 18-crown-6 added, the liquid is reddish purple. An inset shows a potassium ion held at the center of the 18-membered crown ether ring by six oxygen atoms, beside a separate permanganate ion.</desc>
<rect width="860" height="384" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold">(a)</text><text x="52" y="30" font-size="16" font-weight="bold">KMnO<tspan dy="5.1" font-size="70%">4</tspan><tspan dy="-5.1"> in isopropanol</tspan></text><defs><clipPath id="clip1"><path d="M82,60 V280 A30,30 0 0 0 142,280 V60 Z"/></clipPath></defs><path d="M82,60 V280 A30,30 0 0 0 142,280 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip1)"><rect x="-10" y="122.5" width="2000" height="207.5" fill="#f6f8fa" fill-opacity="1"/><path d="M92,292 l6,-8 7,5 -3,7 Z" fill="#3b0f3f" stroke="none" stroke-width="0"/><path d="M104,296 l6,-8 7,5 -3,7 Z" fill="#3b0f3f" stroke="none" stroke-width="0"/><path d="M116,290 l6,-8 7,5 -3,7 Z" fill="#3b0f3f" stroke="none" stroke-width="0"/><path d="M126,296 l6,-8 7,5 -3,7 Z" fill="#3b0f3f" stroke="none" stroke-width="0"/><path d="M100,284 l6,-8 7,5 -3,7 Z" fill="#3b0f3f" stroke="none" stroke-width="0"/><path d="M114,282 l6,-8 7,5 -3,7 Z" fill="#3b0f3f" stroke="none" stroke-width="0"/></g><path d="M79,60 H82 V280 A30,30 0 0 0 142,280 V60 H145" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="112" y="340" font-size="14" text-anchor="middle">Colorless liquid;</text><text x="112" y="358.2" font-size="14" text-anchor="middle">purple solid does not dissolve</text><text x="300" y="30" font-size="16" font-weight="bold">(b)</text><text x="332" y="30" font-size="16" font-weight="bold">With a little 18-crown-6</text><defs><clipPath id="clip2"><path d="M362,60 V280 A30,30 0 0 0 422,280 V60 Z"/></clipPath></defs><path d="M362,60 V280 A30,30 0 0 0 422,280 V60 Z" fill="#f3f8fb" stroke="none" stroke-width="0"/><g clip-path="url(#clip2)"><rect x="-10" y="122.5" width="2000" height="207.5" fill="#a43a8f" fill-opacity="0.85"/></g><path d="M359,60 H362 V280 A30,30 0 0 0 422,280 V60 H425" fill="none" stroke="#4f6475" stroke-width="2.2" stroke-linejoin="round"/><text x="392" y="340" font-size="14" text-anchor="middle">Reddish-purple solution</t