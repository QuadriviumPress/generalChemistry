name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: QuadriviumPress/bindery/.github/workflows/deploy.yml@main
    with:
      build-command: npm run verify && npm run build
      output-dir: _build/html
      node-options: --max-old-space-size=6144
